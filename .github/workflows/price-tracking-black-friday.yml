name: Price Tracking (Black Friday - Every 2h)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Run Black Friday 2h price tracking (until 2026-11-30)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TODAY_UTC=$(date -u +%Y-%m-%d)
          if [ "$TODAY_UTC" \> "2026-11-30" ]; then
            echo "Semana de Black Friday encerrada ($TODAY_UTC); mantendo apenas o cron diário da Vercel."
            exit 0
          fi

          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 65 -H "Authorization: Bearer $CRON_SECRET" \
              "https://app-controle-gastos-swart.vercel.app/api/cron/price-tracking"
          else
            curl -fsS --max-time 65 \
              "https://app-controle-gastos-swart.vercel.app/api/cron/price-tracking"
          fi
